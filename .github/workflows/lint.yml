name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Explicit permissions for security
permissions:
  contents: read

# Prevent duplicate runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'

      # --no-install-project is a uv sync flag, so the environment is built
      # here and the run step consumes it with --no-sync. See
      # .sonarcloud.properties for why the project install has to be skipped.
      - name: Install dependencies
        run: uv sync --locked --no-build --no-install-project --extra dev

      - name: Lint markdown (pymarkdown)
        run: uv run --no-sync --no-build pre-commit run pymarkdown --all-files

  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'

      # ruff and pytest need only the dev extra; the export extra is what
      # blocks --no-build, because owlready2 publishes no wheel.
      - name: Install dependencies
        run: uv sync --locked --no-build --no-install-project --extra dev

      - name: Lint Python (ruff)
        run: uv run --no-sync --no-build ruff check scripts/ tests/ conftest.py

      - name: Run unit tests
        run: uv run --no-sync --no-build pytest

      # The export extra is needed so mypy can resolve neo4j/pydantic imports.
      # It no longer pulls owlready2, so --no-build applies here too.
      - name: Install type-checking dependencies
        run: uv sync --locked --no-build --no-install-project --extra dev --extra export

      # Strict type-checking is enforced file-by-file as scripts are brought
      # into compliance; add scripts here once they pass mypy --strict.
      - name: Type-check Python (mypy strict)
        run: |
          uv run --no-sync --no-build mypy \
            scripts/check_readme_examples.py \
            scripts/check_version_consistency.py \
            scripts/merge_ttls_with_imports.py \
            scripts/export_to_neo4j.py

  commitizen:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'

      - name: Lint commit messages (commitizen)
        run: >-
          uv run --locked --extra dev cz check
          --rev-range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
