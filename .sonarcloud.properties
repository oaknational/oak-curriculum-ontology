sonar.python.version=3.12

# S8541 asks for "uv run --no-build" / "uv sync --no-build". That flag refuses
# to build any source distribution, including this project itself, which is
# installed from source as an editable dependency:
#
#   error: Distribution `oak-curriculum-ontology @ editable+.` can't be
#   installed because it is marked as `--no-build` but has no binary
#   distribution
#
# uv has no "build the local project only" inverse of --no-build, so the flag
# cannot be adopted without publishing a wheel for this project. Third-party
# resolution is pinned by uv.lock and every uv invocation now passes --locked,
# which is the part of the supply-chain risk we can actually close.
#
# The constraint is project-wide rather than per-directory: it applies to every
# uv invocation in the repository, so the rule is excluded repo-wide instead of
# by path. A directory-scoped resourceKey was tried first and matched
# inconsistently across workflow files.
#
# Revisit if uv gains a way to allow builds for the workspace root only.
sonar.issue.ignore.multicriteria=uvNoBuildActions,uvNoBuildShell

sonar.issue.ignore.multicriteria.uvNoBuildActions.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.uvNoBuildActions.resourceKey=**/*

sonar.issue.ignore.multicriteria.uvNoBuildShell.ruleKey=shell:S8541
sonar.issue.ignore.multicriteria.uvNoBuildShell.resourceKey=**/*
