sonar.python.version=3.12

# S8541 asks for "uv run --no-build" / "uv sync --no-build". Every workflow now
# does this. Two obstacles had to be cleared first.
#
# The project installs itself as an editable dependency, which is a source
# distribution with no wheel to fall back on:
#
#   error: Distribution `oak-curriculum-ontology @ editable+.` can't be
#   installed because it is marked as `--no-build` but has no binary
#   distribution
#
# --no-install-project removes it, which is safe here because
# [tool.setuptools] packages is empty: the project contributes no importable
# modules, only its dependency set. Workflows therefore sync once with
# --no-build --no-install-project and then run with --no-sync.
#
# The second was owlready2, which publishes an sdist and no wheels:
#
#   error: Distribution `owlready2==0.50` can't be installed because it is
#   marked as `--no-build` but has no binary distribution
#
# It used to sit in the "export" extra, which mypy needs for the neo4j and
# pydantic imports, so it blocked --no-build for the whole type-checking step.
# It is imported by exactly one script and is not needed for type-checking, so
# it now lives in its own "sql" extra and "export" is wheel-only.
#
# The remaining exclusion is for the shell scripts, which developers run
# directly and which therefore sync on each uv run rather than assuming a
# prepared environment. Applying the workflow pattern there would mean
# requiring a manual sync before running them locally.
sonar.issue.ignore.multicriteria=uvNoBuildShell

sonar.issue.ignore.multicriteria.uvNoBuildShell.ruleKey=shell:S8541
sonar.issue.ignore.multicriteria.uvNoBuildShell.resourceKey=scripts/**/*.sh
