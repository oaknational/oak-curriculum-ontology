sonar.python.version=3.12

# S8541 asks for "uv run --no-build" / "uv sync --no-build", and that fix is
# adopted everywhere it can be. Two obstacles had to be cleared first.
#
# The project installs itself as an editable dependency, which is a source
# distribution with no wheel to fall back on:
#
#   error: Distribution `oak-curriculum-ontology @ editable+.` can't be
#   installed because it is marked as `--no-build` but has no binary
#   distribution
#
# --no-install-project removes it, which is safe here because
# [tool.setuptools] packages is empty: the project contributes no importable
# modules, only its dependency set. Workflows therefore sync once with
# --no-build --no-install-project and then run with --no-sync.
#
# The remaining exclusions cover the invocations that need the "export" extra,
# which pulls owlready2:
#
#   error: Distribution `owlready2==0.50` can't be installed because it is
#   marked as `--no-build` but has no binary distribution
#
# owlready2 publishes an sdist and no wheels at all, so --no-build cannot be
# used wherever that extra is required. That is now a single step: the mypy
# job in lint.yml, which needs the extra to resolve the neo4j and pydantic
# imports. ruff and pytest were only asking for it out of habit and now run
# on the dev extra alone. Resolution in the mypy step is still pinned by
# uv.lock via --locked.
#
# owlready2 is imported by exactly one script (scripts/generate_sql_schema.py)
# and is not needed for type-checking, so moving it into its own extra would
# remove this last exclusion entirely.
#
# Revisit if owlready2 starts publishing wheels, at which point these
# exclusions can be deleted outright.
sonar.issue.ignore.multicriteria=uvNoBuildExportExtra,uvNoBuildShell

# lint.yml: ruff, pytest and mypy all need --extra export
sonar.issue.ignore.multicriteria.uvNoBuildExportExtra.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.uvNoBuildExportExtra.resourceKey=.github/workflows/lint.yml

# Shell scripts are run directly by developers, so they sync on each uv run
# rather than assuming a prepared environment.
sonar.issue.ignore.multicriteria.uvNoBuildShell.ruleKey=shell:S8541
sonar.issue.ignore.multicriteria.uvNoBuildShell.resourceKey=scripts/**/*.sh
